<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP1 maquetado</title>
</head>
<body>
    <main class="ventana">
        <nav class="barraarriba">
            <span></span><span></span><span></span><span></span><span></span>
        </nav>
        <section class="filaprin">
        <aside class="barralate">
            <figure class="miniatura"><span class="miniaturamini"></span></figure>
        </aside>
        <aside class="video"></aside>
    </section>
    <section class="parteabajo">
     <article class="cuadradoiz"></article>
     <article class="cuadradode"></article>
    </section>

    </main>
</body>
</html>

<style class="css">
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: black;
    }

    .ventana{  
    width: 900px;
    height: 910px;
    display: flex;
    flex-direction: column;
    background-color: white;
    padding: 30px 30px 0 30px;

    .parteabajo{
        display: flex;
        height: 480px;
        margin-top: auto;
        margin-left: -30px;
        margin-right: -30px;

        .cuadradoiz{
            flex: 1;
            background-color: #656d78;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .cuadradode{
            flex: 1;
            background-color: #3d434c;
            display: flex;
            align-items: center;
            padding: 30px;
            gap: 15px;

        }
    }
    .filaprin{
        height: 300px;
        margin-bottom: 30px;
        display: flex;
        gap: 25px;

        .barralate{
            width: 20%;

            .miniatura{
                background-color: #ffd280;
                aspect-ratio: 1 / 1;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 15px;

                .miniaturamini{
                    width: 75%;
                    height: 60%;
                    background-color: #ffb347;
                }
            }
        }
        .video{
            flex: 1;
            background-color: #656d78;
            display: flex;
            gap: 20px;
            padding: 25px;}
        }
    
    }
    .barraarriba{
        height: 45px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: #ffd280;
    span{
        width: 17%;
            height: 7px;
            background-color: white;
    }
    }



</style>
