<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP1 maquetado</title>
</head>
<body>
    <main class="ventana">
        <nav class="barraarriba">
            <span></span><span></span><span></span><span></span><span></span>
        </nav>
        <section class="filaprin">
        <aside class="barralate">
            <figure class="miniatura"><span class="miniaturamini"></span></figure>
            <p class="linea"></p>
            <p class="linea"></p>
            <div class="boton"></div>
        </aside>
        <aside class="cad">
            <figure class="cadmini"></figure>
            <section class="infocad">
                <p class="titulocad"></p>
                <p class="descripcion"></p>
                <p class="descripcion"></p>
                <p class="descripcion"></p>
                <p class="descripcion corta"></p>
            </section>
        </aside>
        
    </section>
    <section class="parteabajo">
     <article class="cuadradoiz">
        <figure class="video"><span class="botonvideo"></span></figure>
        <div class="botonabajo">
            <span class="lvideo"></span>
        </div>
     </article>
     <article class="cuadradode">
        <figure class="IMG-lista">
            <div class="IMG"></div><div class="IMG"></div><div class="IMG"></div><div class="IMG"></div>
        </figure>
     </article>
    </section>

    </main>
</body>
</html>

<style class="css">
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: black;
    }

    .ventana{  
    width: 900px;
    height: 910px;
    display: flex;
    flex-direction: column;
    background-color: white;
    padding: 30px 30px 0 30px;

    .parteabajo{
        display: flex;
        height: 480px;
        margin-top: auto;
        margin-left: -30px;
        margin-right: -30px;

        .cuadradoiz{
            flex: 1;
            background-color: #656d78;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;

            .video{
                width: 78%;
                aspect-ratio: 4 / 3;
                background-color: #cccccc;
                border: 8px solid white;
                display: flex;
                justify-content: center;
                align-items: center;

            .botonvideo{
                width: 0;
                height: 0;
                border-top: 22px solid transparent;
                border-bottom: 22px solid transparent;
                border-left: 35px solid white;
                margin-left: 8px;
            }
            }
            .botonabajo{
                width: 28%;
                height: 22px;
                background-color: #ffd280;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;

            .lvideo{
            width: 65%;
            height: 7px;
            background-color: white;
            }
            }

        
        }
        .cuadradode{
            flex: 1;
            background-color: #3d434c;
            display: flex;
            align-items: center;
            padding: 30px;
            gap: 15px;

            .IMG-lista{
                flex: 1;
                flex-direction: column;
                justify-content: space-between;
                gap: 30px;
                display: flex;
                
                .IMG{
                    width: 80px;
                    height: 50px;
                    background-color: #cccccc;

                }
            }

        }
    }
    .filaprin{
        height: 300px;
        margin-bottom: 30px;
        display: flex;
        gap: 25px;

        .barralate{
            width: 20%;

            .miniatura{
                background-color: #ffd280;
                aspect-ratio: 1 / 1;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 15px;

                .miniaturamini{
                    width: 75%;
                    height: 60%;
                    background-color: #ffb347;
                }
            }
            .linea{
                height: 18px;
                width: 100%;
                background-color: #cccccc;
                margin-bottom: 10px;
            }

            .boton{
                width: 40%;
                height: 22px;
                background-color: #4b515c;
                border: none;
                margin-top: 20px;
                margin-left: auto;
            }
        }
        .cad{
            flex: 1;
            background-color: #656d78;
            display: flex;
            gap: 20px;
            padding: 25px;
          
            .cadmini{
                width: 42%;
                aspect-ratio: 1 / 1;
                background-color: #3d434c;
            }
            .infocad{
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;

                .titulocad{
                    width: 45%;
                    height: 14px;
                    background-color: #ffd280;
                    margin-bottom: 10px;
                }

                .descripcion{
                    height: 6px;
                    width: 100%;
                    background-color: #a9aeb5;
                }
                .descripcion.corta{ 
                    width: 60%; 
                }


            }
        }
        }
    
    }
    .barraarriba{
        height: 45px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: #ffd280;
    span{
        width: 17%;
            height: 7px;
            background-color: white;
    }
    }



</style>
